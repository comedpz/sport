function renderGear(){
  const g = gearItems(gearOf(run.plan));
  const feel = Object.entries(FEEL).map(([v, f]) =>
    `<button class="rbtn ${run.feel === v ? 'sel' : ''}" data-action="feel" data-v="${v}" aria-pressed="${run.feel === v}" data-test="feel-${v}">${f.label}</button>`).join('');
  return {
    phase:'Avant de commencer', color:'var(--warm)',
    body:`<div class="ex-name">${esc(run.recipe.name)}</div>
      <div class="muted">≈ ${fmtMin(estimateSec(run.session, state, run.feel))}</div>
      <div class="card gear-card" data-test="gear"><div class="lbl small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.08em">Prépare ton matériel</div>
        ${g.length ? g.map(([i, t]) => `<div class="gear-item"><span aria-hidden="true">${i}</span>${esc(t)}</div>`).join('') : '<div class="gear-item">Rien du tout aujourd’hui !</div>'}</div>
      <div class="feel-q">Comment tu te sens aujourd’hui ?</div>
      <div class="rate feel" style="width:100%">${feel}</div>
      <div class="small muted" style="margin-top:8px">${esc(FEEL[run.feel].hint)}</div>`,
    controls:`<button class="btn primary wide" data-action="go" data-test="gear-go">J’ai tout, c’est parti</button>`
  };
}
function renderWorkout(){
  const s = cur(), p = run.plan, sess = run.session;
  const pct = Math.round(run.idx / p.length * 100);
  const workSteps = p.filter(x => x.kind === 'work' && !x.warm);
  let sub = '';
  if (s.kind === 'work') sub = stepLabel(s);
  else if (s.kind === 'rest' && s.warm) sub = 'Échauffement';
  else if (s.kind === 'rest' && s.roundBreak) sub = run.recipe.format === 'tabata' ? 'Fin du bloc' : run.recipe.format === 'pyramid' ? 'Fin du palier' : 'Fin du tour';
  else if (s.kind === 'rest') sub = `${doneCount()}/${workSteps.length} exercices faits`;

  let phase, color, body, controls;
  const pauseBtn = `<button class="btn" data-action="pause" data-test="pause">${run.paused ? 'Reprendre' : 'Pause'}</button>`;
  const pausedLbl = run.paused ? '<div class="paused">EN PAUSE</div>' : '';
  if (s.kind === 'gear'){
    ({phase, color, body, controls} = renderGear());
  } else if (s.kind === 'ready'){
    phase = 'Prépare-toi'; color = 'var(--warm)';
    body = `<div class="ex-name">${esc(EXERCISES[s.next.exId].name)}</div>${chipsFor(s.next)}
      <div class="ring">${ringSvg(color)}<div class="mid"><div class="big" id="tMain">5</div><div class="unit">secondes</div>${pausedLbl}</div></div>
      <div class="cue">${esc(EXERCISES[s.next.exId].cue)}</div>`;
    controls = `${pauseBtn}<button class="btn primary" data-action="skip" data-test="skip">Go !</button>`;
  } else if (s.kind === 'work'){
    phase = s.warm ? 'Échauffement' : s.fixed ? 'À fond !' : 'À toi !'; color = s.warm ? 'var(--warm)' : 'var(--accent)';
    const sideLbl = s.sides && s.type === 'time' ? `<div class="side" data-test="side">${EXERCISES[s.exId].sideWord === 'jambe' ? 'Jambe' : 'Côté'} ${run.switched ? 2 : 1}/2</div>` : '';
    const mid = s.type === 'time'
      ? `<div class="big" id="tMain"></div><div class="unit">secondes</div>${sideLbl}`
      : `<div class="big" data-test="target">${s.target}</div><div class="unit">${unitWord(s)}</div><div class="unit" id="tMain"></div>`;
    body = `<div class="ex-name" data-test="ex-name">${esc(EXERCISES[s.exId].name)}</div>${chipsFor(s)}
      <div class="ring">${ringSvg(color)}<div class="mid">${mid}${pausedLbl}</div></div>
      <div class="cue">${esc(EXERCISES[s.exId].cue)}</div>`;
    controls = s.type === 'reps'
      ? `${pauseBtn}<button class="btn ghost" data-action="skip" data-test="skip">Passer</button><button class="btn primary wide" data-action="done" data-test="done">Terminé ✓</button>`
      : `${pauseBtn}<button class="btn ghost" data-action="skip" data-test="skip">Passer</button>`;
  } else {
    phase = s.warm ? 'On enchaîne' : s.roundBreak ? 'Grosse pause' : 'Repos'; color = 'var(--rest)';
    const prevStep = p[run.idx - 1];
    const rate = (prevStep.warm || prevStep.fixed || prevStep.early || !run.done.has(run.idx - 1)) ? '' : `<div class="rate-box" data-test="rate-box"><div class="rate-q">${esc(EXERCISES[s.prevExId].name)}, c’était comment ?</div>${ratingRow(s.prevExId)}</div>`;
    body = `<div class="ring" style="margin-top:4px">${ringSvg(color)}<div class="mid"><div class="big" id="tMain"></div><div class="unit">secondes</div>${pausedLbl}</div></div>
      ${rate}${nextCard(s.next, 'Ensuite', s)}`;
    controls = `<button class="btn" data-action="addrest" data-test="addrest">+10 s</button><button class="btn rest" data-action="skip" data-test="skip">Passer le repos</button>`;
  }
  return `
  <div class="wk-top"><button class="icon" data-action="quit" aria-label="Arrêter la séance" data-test="quit">✕</button>
    <div class="wk-prog"><div class="bar"><i style="width:${pct}%"></i></div><div class="wk-sub">${esc(run.recipe.name)}${sub ? ' · ' + sub : ''}</div></div></div>
  <div class="stage" data-test="phase-${s.kind}"><div class="phase" style="color:${color}">${phase}</div>${body}</div>
  <div class="controls">${controls}</div>`;
}
function updateTimer(){
  if (!run || view !== 'workout') return;
  const s = cur(), el = document.getElementById('tMain'), ring = document.getElementById('ringVal');
  if (!el) return;
  const C = 565.49;
  if (run.endAt === null){   // répétitions : chrono qui monte
    const sec = Math.floor(((run.paused ? run.pausedAt : now()) - run.stepStart)/1000);
    el.textContent = '⏱ ' + Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
    if (ring) ring.style.strokeDashoffset = '0';
    return;
  }
  let msLeft = run.paused ? run.remaining : run.endAt - now();
  let total = s.dur;
  if (s.kind === 'work' && s.sides && s.type === 'time'){ total = s.target; if (!run.switched) msLeft -= s.target*1000; }
  const sec = Math.max(0, Math.ceil(msLeft/1000));
  el.textContent = fmtClock(sec);
  if (ring) ring.style.strokeDashoffset = String(C * (1 - Math.max(0, Math.min(1, msLeft/(total*1000)))));
}

function changeText(c){
  const d = EXERCISES[c.id];
  const st = {exId:c.id, type:d.type, sides:!!d.sides};
  if (c.change === 'weight-up') return `<span class="up">↑</span> ${esc(d.name)} : passe à <b>${c.wTo} kg</b> (${c.to} ${unitWord(st, true)})`;
  if (c.change === 'weight-down') return `<span class="down">↓</span> ${esc(d.name)} : passe à <b>${c.wTo} kg</b> (${c.to} ${unitWord(st, true)})`;
  return `<span class="${c.change}">${c.change === 'up' ? '↑' : '↓'}</span> ${esc(d.name)} : ${c.from} → <b>${c.to} ${unitWord(st, true)}</b>`;
}
function renderEnd(){
  const ids = ratedIds(), dc = doneCount();
  const total = run.plan.filter(s => s.kind === 'work' && !s.warm).length;
  const hero = `<div class="done-hero"><div class="big">Bravo !</div><div class="muted">${esc(run.recipe.name)}</div></div>
    <div class="stats"><div class="card stat"><b data-test="end-duration">${fmtMin(elapsedSec())}</b><span class="muted small">durée</span></div>
    <div class="card stat"><b data-test="end-count">${dc}/${total}</b><span class="muted small">exercices</span></div></div>`;
  if (run.saved){
    const lv = levelOf(totalPoints()), g = run.gain;
    const ch = run.changes.length
      ? run.changes.map(c => `<div class="change" data-test="change">${changeText(c)}</div>`).join('')
      : `<div class="muted">Rien ne change : on garde les mêmes objectifs.</div>`;
    return `${hero}
      ${g.levelUp ? `<section class="card levelup" data-test="levelup">🎉 Nouveau niveau !<b>Niveau ${lv.lvl} · ${esc(lv.name)}</b></section>` : ''}
      <section class="card" style="margin-top:14px"><div class="gain" data-test="gain"><b>+${g.points} points</b>${g.goal ? ' · objectif de la semaine atteint 🎉' : ''}</div>
        <div class="small muted" style="margin-top:6px">Niveau ${lv.lvl} · ${esc(lv.name)} — encore ${lv.to - lv.p} points pour le suivant</div>${levelBar(lv)}</section>
      <h2>La prochaine fois</h2><section class="card">${ch}</section>
      <div class="stick"><button class="btn primary" data-action="home" data-test="home">Retour à l’accueil</button></div>`;
  }
  if (!dc){
    return `${hero}<p class="muted" style="text-align:center;margin-top:20px">Aucun exercice terminé : rien à enregistrer.</p>
      <div class="stick"><button class="btn primary" data-action="discard" data-test="home">Retour à l’accueil</button></div>`;
  }
  const rows = ids.map(id => `<div class="end-ex"><div class="t">${esc(EXERCISES[id].name)}</div>${ratingRow(id)}</div>`).join('');
  return `${hero}
    ${ids.length ? `<h2>Ton ressenti</h2><p class="small muted" style="margin-top:-6px">Sans réponse, l’exercice ne change pas.</p>
    <section class="card" style="padding-top:2px;padding-bottom:2px">${rows}</section>` : '<p class="small muted" style="margin-top:18px">Séance au chrono : pas de ressenti à donner.</p>'}
    <div class="stick list"><button class="btn primary" data-action="save" data-test="save">Enregistrer la séance</button>
    <button class="btn ghost" data-action="discard-ask" data-test="discard">Ne pas enregistrer</button></div>`;
}

/* Courbe de l'indice de forme (une valeur par semaine) */
function sparkline(series){
  if (series.length < 2) return '';
  const W = 300, H = 90, px = 18, top = 22, bottom = 14;
  const vals = series.map(s => s[1]), lo = Math.min(...vals, 100), hi = Math.max(...vals, lo + 5);
  const x = i => px + i * (W - 2*px) / (series.length - 1);
  const y = v => top + (hi - v) * (H - top - bottom) / (hi - lo);
  const pts = series.map((s, i) => `${x(i).toFixed(1)},${y(s[1]).toFixed(1)}`).join(' ');
  const last = series.length - 1;
  return `<div class="spark" data-test="spark"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Indice de forme semaine par semaine : ${vals.join(', ')}">
    <polyline class="ln" points="${pts}"/>
    ${series.map((s, i) => `<circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(s[1]).toFixed(1)}" r="4"><title>Semaine du ${esc(fmtDate(new Date(s[0]).toISOString(), {day:'numeric', month:'short'}))} : ${s[1]}</title></circle>`).join('')}
    <text class="lb" x="${x(0)}" y="${(y(vals[0]) - 9).toFixed(1)}" text-anchor="start">${vals[0]}</text>
    <text class="lb now" x="${x(last)}" y="${(y(vals[last]) - 9).toFixed(1)}" text-anchor="end">${vals[last]}</text>
  </svg></div>`;
}
const ZONES = [['bas','Bas du corps'],['haut','Haut du corps'],['abdos','Abdos & gainage'],['cardio','Cardio']];
function renderProgress(){
  const total = state.history.filter(h => !h.mini).length, lv = levelOf(totalPoints()), fo = formeIndex(state), stk = streak();
  const touched = id => { const d = EXERCISES[id], s = state.ex[id]; return s.last > 0 || s.target !== d.start || (s.weight ?? null) !== (d.weight ?? null); };
  const lvRow = id => {
    const d = EXERCISES[id], s = state.ex[id];
    const st = {exId:id, type:d.type, sides:!!d.sides, target:s.target};
    const delta = s.target - d.start, wDelta = (s.weight || 0) - (d.weight || 0);
    let trend = '';
    if (wDelta > 0) trend = ` <span class="up">↑ ${s.weight} kg</span>`;
    else if (wDelta < 0) trend = ` <span class="down">↓ ${s.weight} kg</span>`;
    else if (delta) trend = ` <span class="${delta > 0 ? 'up' : 'down'}">${delta > 0 ? '+' : ''}${delta}</span>`;
    return `<div class="lvl" data-test="lvl-${id}"><span>${esc(d.name)}</span><span class="v">${targetLabel(st)}${s.weight ? ' · ' + s.weight + ' kg' : ''}${trend}</span></div>`;
  };
  const shown = new Set();
  const lvls = ZONES.map(([z, label]) => {
    const ids = Object.keys(state.ex).filter(id => !shown.has(id) && zonesOf(EXERCISES[id])[0] === z && touched(id));
    ids.forEach(id => shown.add(id));
    return ids.length ? `<div class="zone-h">${label}</div>${ids.map(lvRow).join('')}` : '';
  }).join('');
  const hist = state.history.slice(0, 40).map(h =>
    `<div class="hist" data-test="hist"><div><div style="font-weight:600">${esc(h.name)}</div><div class="small muted">${esc(fmtDate(h.date))}${kindOf(h) ? ' · ' + KINDS[kindOf(h)] : ''}${h.extra ? ' · en plus' : ''}</div></div>
     <div class="small muted" style="text-align:right">${fmtMin(h.durationSec || 0)} · ${esc(h.done)}/${esc(h.total)} exos<br>+${sessionPoints(h)} pts</div></div>`).join('');
  return `<h1>Progrès</h1>${storageWarn()}
  <section class="card week"><div class="small muted">Niveau ${lv.lvl}</div><b style="font-size:20px">${esc(lv.name)}</b>${levelBar(lv)}
    <div class="small muted" style="margin-top:6px">${lv.p} points · encore ${lv.to - lv.p} pour le niveau suivant</div></section>
  <div class="stats"><div class="card stat"><b data-test="p-forme">${fo}</b><span class="muted small">indice de forme</span></div>
  <div class="card stat"><b>${stk ? '🔥 ' + stk : '0'}</b><span class="muted small">semaine${stk > 1 ? 's' : ''} d’affilée à ${WEEK_GOAL} séances</span></div>
  <div class="card stat"><b>${weekCount()}/${WEEK_GOAL}</b><span class="muted small">cette semaine</span></div>
  <div class="card stat"><b data-test="total">${total}</b><span class="muted small">séances en tout</span></div></div>
  <h2>Indice de forme</h2><section class="card"><div class="small muted">Il part de 100 et monte quand tes objectifs augmentent (+1 point par 10 % de progrès sur un exercice).</div>${sparkline(formeSeries())}</section>
  <h2>Mes objectifs actuels</h2><section class="card" style="padding-top:4px;padding-bottom:4px">${lvls || '<p class="muted">Ils apparaîtront après ta première séance.</p>'}</section>
  <h2>Historique</h2><section class="card" style="padding-top:4px;padding-bottom:4px">${hist || '<p class="muted">Pas encore de séance. Lance-toi !</p>'}</section>`;
}

function renderSettings(){
  const tg = (key, label, hint) => `<button class="toggle" data-action="toggle" data-key="${key}" aria-pressed="${!!state.settings[key]}" data-test="toggle-${key}">
    <span><span style="font-weight:600">${label}</span><br><span class="small muted">${hint}</span></span><span class="sw"></span></button>`;
  return `<h1>Réglages</h1>${storageWarn()}
  <h2>Pendant la séance</h2>
  <section class="card">${tg('sound', 'Bips', 'Décompte 3-2-1 et changements d’exercice')}${tg('voice', 'Voix', 'Annonce le matériel et les exercices à voix haute')}</section>
  <p class="small muted">Sur iPhone : pas de son si le téléphone est en mode silencieux. La vibration ne marche que sur Android.</p>
  <h2>Comment ça marche</h2>
  <section class="card small"><ul class="rules">
    <li><b>Programme</b> : 3 séances par semaine, muscu et cardio en alternance, qui changent chaque semaine (cycle de 4 semaines). Les exercices tournent aussi.</li>
    <li><b>Pauses</b> : environ 15 s en muscu et 10 s en cardio, un peu plus quand il faut changer d’haltère, mettre les chevillères ou se mettre au sol.</li>
    <li><b>Trop dur</b> : −15 % la prochaine fois · <b>OK</b> : on garde, et après 2 « OK » de suite : +5 % · <b>Trop facile</b> : +15 %</li>
    <li>Entre 5 et 30 répétitions, entre 15 et 60 secondes. Arrivée au max, l’haltère passe au kilo du dessus (jusqu’à 3 kg).</li>
    <li><b>Points</b> : 1 par minute de séance, +${FULL_BONUS} si tu fais tous les exercices, +${GOAL_BONUS} quand tu atteins ${WEEK_GOAL} séances dans la semaine.</li>
  </ul></section>
  <h2>Mes données</h2>
  <p class="small muted" style="margin-top:-6px">Elles restent sur ce téléphone. Fais une sauvegarde de temps en temps (iCloud, mail…).</p>
  <div class="list">
    <button class="btn" data-action="export" data-test="export">Sauvegarder mes données</button>
    <button class="btn" data-action="import" data-test="import">Restaurer une sauvegarde</button>
    <button class="btn danger" data-action="reset" data-test="reset">Tout effacer</button>
  </div>
  <p class="small muted" style="text-align:center;margin-top:24px">CrocoFit v${VERSION}</p>`;
}

function render(){
  const full = view === 'workout' || view === 'end';
  $app.className = full ? 'full' : '';
  let html;
  if (view === 'workout') html = renderWorkout();
  else if (view === 'end') html = renderEnd();
  else if (view === 'preview') html = renderPreview();
  else if (tab === 'progress') html = renderProgress() + tabbar();
  else if (tab === 'settings') html = renderSettings() + tabbar();
  else html = renderHome() + tabbar();
  $app.innerHTML = html;
  if (view === 'workout') updateTimer();
}

/* ---------- modal & toast ---------- */
const $modal = document.getElementById('modal');
function modal(title, text, buttons){
  $modal.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><p>${esc(text)}</p>
    <div class="list">${buttons.map(b => `<button class="btn ${b.cls || ''}" data-action="${b.action}"${b.id ? ` data-id="${b.id}"` : ''} data-test="m-${b.action}${b.id ? '-' + b.id : ''}">${esc(b.label)}</button>`).join('')}</div></div>`;
  $modal.hidden = false;
}
function closeModal(){ $modal.hidden = true; $modal.innerHTML = ''; }
let toastT = null;
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
function openPreview(sess){ previewSess = sess; view = 'preview'; render(); window.scrollTo(0, 0); }

/* ---------- actions ---------- */
const actions = {
  tab(d){ tab = d.id; view = 'home'; render(); window.scrollTo(0, 0); },
  preview(d){
    const plan = ensurePlan(), i = +d.slot, s = plan.sessions[i];
    openPreview(Object.assign({}, s, {items:s.items.slice()}, doneSlots(plan).has(i) ? {extra:true} : {slot:i, week:plan.week}));
  },
  extra(){ modal('Une séance en plus ?', 'Choisis ce que tu veux travailler, je prépare la séance.',
    EXTRA_THEMES.map(t => ({label:t.label, action:'extra-theme', id:t.id})).concat([{label:'Annuler', action:'modal-close', cls:'ghost'}])); },
  'extra-theme'(d){
    closeModal();
    const plan = ensurePlan(), done = doneSlots(plan), used = new Map();   // exercices encore prévus cette semaine : en dernier choix
    plan.sessions.forEach((s, i) => { if (!done.has(i)) s.items.forEach(id => used.set(id, 1e15)); });
    openPreview(Object.assign(makeSession(chooseExtraRecipe(d.id), state, String(now()), used), {extra:true}));
  },
  home(){ run = null; view = 'home'; tab = 'home'; render(); window.scrollTo(0, 0); },
  start(){ startSession(previewSess); },
  go(){ advance(true); },
  feel(d){ run.feel = d.v; run.plan = buildPlan(run.session, state, d.v); render(); },
  pause(){ if (run.paused) resumeRun(); else pauseRun(); render(); },
  skip(){ advance(cur().kind !== 'work'); },
  done(){ advance(true); },
  addrest(){ if (run.paused) run.remaining += 10000; else run.endAt += 10000; run.lastBeep = null; updateTimer(); },
  rate(d){
    run.ratings[d.ex] = run.ratings[d.ex] === d.v ? undefined : d.v;
    if (!run.ratings[d.ex]) delete run.ratings[d.ex];
    const y = window.scrollY; render(); window.scrollTo(0, y);
  },
  quit(){
    run.pausedByQuit = !run.paused; pauseRun(); render();
    modal('Arrêter la séance ?', 'Tu peux enregistrer ce que tu as déjà fait.', [
      {label:'Terminer et enregistrer', action:'quit-finish', cls:'primary'},
      {label:'Abandonner sans enregistrer', action:'quit-abandon', cls:'danger'},
      {label:'Continuer la séance', action:'quit-cancel'}]);
  },
  'quit-finish'(){ closeModal(); finish(); },
  'quit-abandon'(){ closeModal(); abandon(); },
  'quit-cancel'(){ closeModal(); if (run.pausedByQuit) resumeRun(); render(); },
  save(){ saveSession(); window.scrollTo(0, 0); },
  'discard-ask'(){ modal('Ne pas enregistrer ?', 'Cette séance ne comptera pas et les objectifs ne bougeront pas.', [
      {label:'Oui, ne pas enregistrer', action:'discard', cls:'danger'}, {label:'Annuler', action:'modal-close'}]); },
  discard(){ closeModal(); abandon(); },
  toggle(d){ state.settings[d.key] = !state.settings[d.key]; save(); render(); },
  export(){ exportData(); },
  import(){ document.getElementById('importFile').click(); },
  'import-confirm'(){ if (pendingImport){ state = pendingImport; pendingImport = null; save(); } closeModal(); toast('Données restaurées'); render(); },
  reset(){ modal('Tout effacer ?', 'Historique et objectifs reviennent à zéro. Pense à faire une sauvegarde avant.', [
      {label:'Oui, tout effacer', action:'reset-confirm', cls:'danger'}, {label:'Annuler', action:'modal-close'}]); },
  'reset-confirm'(){ state = defaultState(); save(); closeModal(); toast('Données effacées'); render(); },
  'modal-close'(){ closeModal(); pendingImport = null; }
};
const STEP_ACTIONS = new Set(['go', 'skip', 'done']);
let lastStepTap = 0;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  if (run) unlockAudio();   // iPhone : relance le son s'il a été coupé (appel, Siri, autre app)
  if (STEP_ACTIONS.has(b.dataset.action)){   // double tap : le 2e tap tomberait sur le bouton de l'écran suivant
    if (now() - lastStepTap < 400) return;
    lastStepTap = now();
  }
  const fn = actions[b.dataset.action];
  if (fn) fn(b.dataset, b);
});
$modal.addEventListener('click', e => { if (e.target === $modal && !run) closeModal(); });

/* ---------- accès pour les tests ---------- */
window.CM = {adjust, buildPlan, estimateSec, makeSession, formeIndex, levelOf, totalPoints, streak, cycleWeek, weekStart,
  EXERCISES, RECIPES, CYCLE, WARMUPS, REST, LIMITS, events, openPreview,
  getState: () => state, getRun: () => run, getView: () => view, refresh: () => updateTimer()};

render();
</script>
</body>
