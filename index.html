<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrocoFit">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>CrocoFit</title>
<style>
:root{
  --bg:#111316;--card:#1a1d22;--card2:#23272e;--line:#2e333b;
  --text:#f3f4f6;--muted:#9aa2ad;
  --accent:#ff6b4a;--rest:#2fd39a;--warm:#f5b83d;--hard:#ff5d6c;--easy:#2fd39a;
  --r:18px;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.4}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{margin:0}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 104px)}
#app.full{padding-bottom:calc(env(safe-area-inset-bottom) + 16px);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* --- generic --- */
.eyebrow{font-size:13px;color:var(--muted)}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
h2{font-size:18px;font-weight:700;margin:26px 0 12px}
.card{background:var(--card);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.list{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 18px;border-radius:16px;font-weight:700;font-size:17px;background:var(--card2);width:100%}
.btn.primary{background:var(--accent);color:#1a0d08}
.btn.rest{background:var(--rest);color:#06231a}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid #5a2a30;color:var(--hard)}
.btn:active{transform:scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--card2);color:var(--text)}
.warn{margin-top:14px;padding:12px 14px;border-radius:14px;background:#3a2a12;color:#f9d48a;font-size:14px}

/* --- home --- */
.top{display:flex;justify-content:space-between;align-items:flex-end}
.week{margin-top:18px}
.dots{display:flex;gap:8px;margin-top:12px}
.dot{flex:1;height:8px;border-radius:99px;background:var(--card2)}
.dot.on{background:var(--accent)}
.session{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border-left:4px solid var(--accent)}
.session.mini{border-left-color:var(--warm)}
.s-main{flex:1;min-width:0}
.s-name{font-weight:700;font-size:18px}
.s-focus{color:var(--muted);font-size:14px;margin-top:2px}
.s-meta{color:var(--muted);font-size:13px;margin-top:8px}
.go{font-size:28px;color:var(--muted)}

/* --- tabbar --- */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(17,19,22,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .inner{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;min-height:60px;font-size:14px;font-weight:600;color:var(--muted)}
.tab.on{color:var(--accent)}

/* --- preview --- */
.back{min-height:44px;color:var(--muted);font-weight:600;margin-bottom:6px}
.pv-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pv-item:last-child{border-bottom:0}
.pv-item .t{font-weight:600}
.pv-item .v{color:var(--muted);white-space:nowrap}
.stick{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 12px);margin-top:18px}

/* --- workout --- */
.wk-top{display:flex;align-items:center;gap:12px}
.icon{width:44px;height:44px;border-radius:12px;background:var(--card);font-size:20px;flex:none}
.wk-prog{flex:1}
.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.wk-sub{font-size:13px;color:var(--muted);margin-top:6px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 0}
.phase{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.ex-name{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 10px;line-height:1.15}
.cue{color:var(--muted);font-size:15px;max-width:34ch;margin:12px auto 0}
.ring{position:relative;width:min(62vw,240px);aspect-ratio:1;margin:18px auto 4px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--card2)}
.ring .val{transition:stroke-dashoffset .2s linear}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.unit{font-size:15px;color:var(--muted);margin-top:4px}
.side{font-size:14px;font-weight:700;color:var(--warm);margin-top:6px}
.paused{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--warm);margin-top:6px}
.next{width:100%;margin-top:14px;text-align:left}
.next .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.next .nm{font-weight:700;font-size:17px;margin-top:2px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.controls .wide{grid-column:1/-1}
.rate-q{font-size:15px;font-weight:600;margin:4px 0 10px;text-align:center}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rbtn{min-height:52px;border-radius:14px;background:var(--card2);font-weight:700;font-size:15px;border:2px solid transparent}
.rbtn.r-hard.sel{background:#3b1a1f;border-color:var(--hard);color:#ffd0d5}
.rbtn.r-ok.sel{background:#2b3038;border-color:#c8ced6}
.rbtn.r-easy.sel{background:#0f3328;border-color:var(--easy);color:#c9ffe9}
.rate-box{width:100%;margin-top:14px}

/* --- end --- */
.done-hero{text-align:center;padding:26px 0 8px}
.done-hero .big{font-size:44px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{text-align:center}
.stat b{display:block;font-size:26px}
.end-ex{padding:14px 0;border-bottom:1px solid var(--line)}
.end-ex:last-child{border-bottom:0}
.end-ex .t{font-weight:700;margin-bottom:8px}
.change{padding:10px 0;border-bottom:1px solid var(--line)}
.change:last-child{border-bottom:0}
.up{color:var(--easy)}.down{color:var(--hard)}

/* --- progress / settings --- */
.lvl{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.lvl:last-child{border-bottom:0}
.lvl .v{white-space:nowrap;font-weight:600}
.hist{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.toggle{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;text-align:left}
.sw{width:50px;height:30px;border-radius:99px;background:var(--card2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
[aria-pressed="true"] .sw{background:var(--rest)}
[aria-pressed="true"] .sw::after{transform:translateX(20px)}
.rules{margin:0;padding-left:18px}
.rules li{margin:6px 0}

/* --- modal / toast --- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:20}
#modal[hidden]{display:none}
.sheet{background:var(--card);border-radius:22px;padding:20px;width:100%;max-width:520px;margin-bottom:env(safe-area-inset-bottom)}
.sheet h3{font-size:20px;margin-bottom:6px}
.sheet p{color:var(--muted);margin:0 0 16px}
.sheet .list{gap:8px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%) translateY(20px);background:#f3f4f6;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:30;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* --- v2 : programme, motivation, matériel --- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--text)}
.badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--accent);color:#1a0d08}
.badge.done{background:transparent;color:var(--rest);padding:3px 0}
.s-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
.session.cardio{border-left-color:var(--rest)}
.session.is-done{opacity:.62}
.session.reco{box-shadow:0 0 0 2px var(--accent) inset}
.mot{display:flex;align-items:center;gap:14px}
.mot .lv{flex:1;min-width:0}
.mot .lv b{font-size:17px}
.mot .side-stat{text-align:center;min-width:64px}
.mot .side-stat b{display:block;font-size:20px}
.lvlbar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:8px}
.lvlbar i{display:block;height:100%;background:var(--warm);border-radius:99px}
.pv-sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 8px}
.gear-card{width:100%;text-align:left;margin-top:14px}
.gear-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:19px;font-weight:700}
.gear-item:last-child{border-bottom:0}
.gear-item span{font-size:24px;width:32px;text-align:center}
.feel-q{font-size:15px;font-weight:600;margin:18px 0 10px}
.feel .rbtn.sel{background:#3a2a12;border-color:var(--warm);color:#f9d48a}
.tip{display:inline-block;margin-top:6px;font-size:14px;font-weight:700;color:var(--warm)}
.levelup{margin-top:14px;text-align:center;border:2px solid var(--warm)}
.levelup b{display:block;font-size:22px;margin-top:4px}
.gain{font-size:15px}
.gain b{color:var(--warm)}
.zone-h{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 2px}
.spark{margin-top:10px}
.spark svg{display:block;width:100%;height:auto}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark .pt{fill:var(--accent);stroke:var(--card);stroke-width:2}
.spark .lb{fill:var(--muted);font-size:11px;font-family:inherit}
.spark .lb.now{fill:var(--text);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<noscript>Active JavaScript pour utiliser CrocoFit.</noscript>
<script>
'use strict';
/* =========================================================
   CrocoFit (ex-Coach Maison) — v2.1
   Les identifiants internes gardent l'ancien nom (clé coachMaison.v1, sauvegardes app:'coach-maison') : ne pas les changer.
   Tout est dans ce fichier. Les données restent sur le téléphone (localStorage).
   ========================================================= */
const VERSION = '2.1';
const STORE_KEY = 'coachMaison.v1';
const LIMITS = { reps:{min:5,max:30,step:1}, time:{min:15,max:60,step:5} };
const MIN_WEIGHT = 1, MAX_WEIGHT = 3;
const WEEK_GOAL = 3;
const DAY = 86400000, WEEK = 7*DAY;
const CYCLE_ORIGIN = new Date(2026, 9, 19).getTime();   // lundi 19 oct. 2026 = semaine 1 du cycle
const now = () => Date.now();

/* ---------- Exercices ----------
   type : 'reps' (répétitions) ou 'time' (secondes) ; start : objectif de départ ; weight : haltère de départ (kg)
   z : zone(s) ('bas', 'haut', 'abdos', 'cardio') ; sides : de chaque côté ; pace : secondes par répétition
   floor : se fait au sol ; hard : effort intense (pause un peu plus longue) ; warm : échauffement */
const EXERCISES = {
  // --- échauffement (ne s'ajuste jamais, durées dans WARMUPS) ---
  rotations:   {name:'Rotations chevilles et hanches', type:'time', start:30, warm:true, cue:'Grands cercles avec les chevilles puis avec les hanches, tranquillement.'},
  genoux:      {name:'Montées de genoux légères', type:'time', start:45, warm:true, cue:'Sur place, à petite allure, on monte le cardio doucement.'},
  w_squat:     {name:'Squats sans haltère', type:'time', start:30, warm:true, cue:'Squats lents et amples, sans charge, pour réveiller les jambes.'},
  w_fente:     {name:'Fentes arrière sans haltère', type:'time', start:30, warm:true, cue:'Un grand pas en arrière, genou vers le sol, on alterne doucement.'},
  w_talons:    {name:'Talons-fesses', type:'time', start:30, warm:true, cue:'Sur place, on ramène les talons vers les fesses, à petite allure.'},
  w_jacks:     {name:'Jumping jacks légers', type:'time', start:45, warm:true, cue:'Petits sauts bras et jambes écartés, sans forcer.'},
  w_bras:      {name:'Cercles de bras', type:'time', start:30, warm:true, cue:'Bras tendus sur les côtés : petits cercles puis grands, dans les deux sens.'},
  w_epaules:   {name:'Rotations d’épaules', type:'time', start:30, warm:true, cue:'On roule les épaules vers l’arrière, puis vers l’avant.'},
  w_pompes_mur:{name:'Pompes contre le mur', type:'time', start:30, warm:true, cue:'Mains au mur à hauteur d’épaules : on plie et on tend les bras lentement.'},
  w_buste:     {name:'Rotations du buste', type:'time', start:30, warm:true, cue:'Debout, bassin fixe : on tourne le buste d’un côté puis de l’autre.'},
  w_chat:      {name:'Chat-vache', type:'time', start:30, warm:true, floor:true, cue:'À 4 pattes : on arrondit le dos en soufflant, puis on le creuse en inspirant.'},
  w_birddog:   {name:'Bird dog lent', type:'time', start:30, warm:true, floor:true, cue:'À 4 pattes : on tend un bras et la jambe opposée, on revient, on change.'},

  // --- bas du corps ---
  squat:       {name:'Squats', type:'reps', start:15, weight:2, z:'bas', cue:'Pieds largeur d’épaules, haltères le long du corps, fesses en arrière, dos droit.'},
  fente:       {name:'Fentes alternées', type:'reps', start:16, weight:2, z:'bas', cue:'Grand pas en avant, genou arrière vers le sol, on alterne les jambes.'},
  fente_arr:   {name:'Fentes arrière', type:'reps', start:16, weight:2, z:'bas', cue:'Grand pas en arrière, genou arrière vers le sol, buste droit ; on alterne les jambes.'},
  fente_lat:   {name:'Fentes latérales', type:'reps', start:12, weight:2, z:'bas', cue:'Grand pas sur le côté, on plie la jambe d’appui en poussant les fesses en arrière ; on alterne.'},
  sumo:        {name:'Squat sumo', type:'reps', start:15, weight:3, z:'bas', cue:'Pieds écartés, pointes vers l’extérieur, un haltère tenu à deux mains entre les jambes.'},
  sdt:         {name:'Soulevé de terre jambes tendues', type:'reps', start:12, weight:2, z:'bas', cue:'Genoux souples, dos droit : on descend les haltères le long des jambes et on remonte en serrant les fessiers.'},
  mollets:     {name:'Montées sur pointes', type:'reps', start:20, weight:3, pace:2, z:'bas', cue:'Debout, haltères le long du corps : on monte sur la pointe des pieds, on redescend lentement.'},
  chaise:      {name:'Chaise contre le mur', type:'time', start:30, z:'bas', cue:'Dos au mur, cuisses parallèles au sol, genoux au-dessus des chevilles.'},
  pont:        {name:'Pont fessier', type:'reps', start:15, weight:3, z:'bas', floor:true, cue:'Sur le dos, pieds au sol, haltère posé sur le bassin : on monte les hanches et on serre les fessiers.'},
  pont_1j:     {name:'Pont fessier sur une jambe', type:'reps', start:10, sides:true, sideWord:'jambe', z:'bas', floor:true, cue:'Sur le dos, une jambe tendue en l’air : on monte les hanches en poussant dans le talon au sol.'},
  kickback:    {name:'Kickbacks à 4 pattes', type:'reps', start:12, sides:true, sideWord:'jambe', gear:'chevillères', z:'bas', floor:true, cue:'À 4 pattes, dos plat : on pousse le talon vers le plafond.'},
  hydrant:     {name:'Fire hydrant', type:'reps', start:12, sides:true, sideWord:'jambe', gear:'chevillères', z:'bas', floor:true, cue:'À 4 pattes : on ouvre le genou sur le côté jusqu’à hauteur de hanche, sans bouger le dos.'},
  abduction:   {name:'Abductions couchée', type:'reps', start:15, sides:true, sideWord:'jambe', gear:'chevillères', z:'bas', floor:true, cue:'Allongée sur le côté, jambe du dessus tendue : on la monte et on la descend lentement.'},

  // --- haut du corps ---
  dev_epaules: {name:'Développé épaules', type:'reps', start:12, weight:2, z:'haut', cue:'Debout, haltères à hauteur d’épaules : on pousse vers le plafond sans cambrer.'},
  curl:        {name:'Curl biceps', type:'reps', start:12, weight:2, z:'haut', cue:'Coudes collés au corps : on monte les haltères vers les épaules, on redescend lentement.'},
  rowing:      {name:'Rowing penché', type:'reps', start:12, weight:3, z:'haut', cue:'Buste penché, dos droit : on tire les haltères vers les hanches en serrant les omoplates.'},
  elev_lat:    {name:'Élévations latérales', type:'reps', start:10, weight:1, z:'haut', cue:'Bras presque tendus : on monte les haltères sur les côtés jusqu’aux épaules, pas plus haut.'},
  triceps:     {name:'Extension triceps', type:'reps', start:12, weight:2, z:'haut', cue:'Un haltère à deux mains derrière la tête : on tend les bras vers le plafond, coudes serrés.'},
  pompes:      {name:'Pompes sur les genoux', type:'reps', start:8, z:'haut', floor:true, cue:'Mains sous les épaules, genoux au sol, corps aligné : on descend la poitrine vers le sol.'},
  dev_couche:  {name:'Développé couché au sol', type:'reps', start:12, weight:3, z:'haut', floor:true, cue:'Sur le dos, genoux pliés : on pousse les haltères vers le plafond, coudes à 45°.'},

  // --- abdos & gainage ---
  planche:     {name:'Gainage planche', type:'time', start:30, z:'abdos', floor:true, cue:'Sur les avant-bras, corps aligné, nombril rentré, on ne creuse pas le dos.'},
  gainage_lat: {name:'Gainage latéral', type:'time', start:20, sides:true, sideWord:'côté', z:'abdos', floor:true, cue:'Sur un avant-bras, hanches hautes, corps aligné. On change de côté au signal.'},
  banane:      {name:'Position banane', type:'time', start:20, z:'abdos', floor:true, cue:'Sur le dos, bras et jambes tendus décollés du sol, bas du dos plaqué : on tient.'},
  ciseaux:     {name:'Ciseaux', type:'time', start:30, z:'abdos', floor:true, cue:'Sur le dos, jambes tendues un peu décollées : on croise et on décroise les jambes.'},
  crunch:      {name:'Crunchs', type:'reps', start:15, z:'abdos', floor:true, cue:'Bas du dos plaqué au sol, on enroule le haut du dos sans tirer sur la nuque.'},
  crunch_velo: {name:'Crunch vélo', type:'reps', start:20, pace:1.5, z:'abdos', floor:true, cue:'Sur le dos, mains aux tempes : coude vers le genou opposé, on alterne (1 côté = 1).'},
  releve:      {name:'Relevés de jambes', type:'reps', start:12, gear:'chevillères', z:'abdos', floor:true, cue:'Allongée, mains sous les fesses, jambes tendues : on monte et on descend lentement sans toucher le sol.'},
  twist:       {name:'Russian twist', type:'reps', start:20, weight:2, pace:2, z:'abdos', floor:true, cue:'Assise, buste incliné, haltère à deux mains : on tourne d’un côté puis de l’autre (1 rotation = 1).'},
  dead_bug:    {name:'Dead bug', type:'reps', start:12, z:'abdos', floor:true, cue:'Sur le dos, bras et genoux vers le plafond : on descend un bras et la jambe opposée, bas du dos collé au sol.'},
  planche_ep:  {name:'Planche toucher d’épaule', type:'reps', start:16, pace:2, z:'abdos', floor:true, cue:'En planche sur les mains, pieds écartés : une main touche l’épaule opposée, sans balancer les hanches.'},
  superman:    {name:'Superman', type:'reps', start:12, z:'abdos', floor:true, cue:'À plat ventre : on décolle bras et jambes en même temps, on tient 1 seconde, on repose.'},

  // --- cardio ---
  jacks:       {name:'Jumping jacks', type:'time', start:30, z:'cardio', cue:'On saute en écartant bras et jambes, puis on revient.'},
  genoux_rap:  {name:'Montées de genoux rapides', type:'time', start:30, z:'cardio', hard:true, cue:'Sur place, on monte les genoux vite, bras actifs.'},
  patineur:    {name:'Patineur', type:'time', start:30, z:'cardio', hard:true, cue:'Sauts d’un pied sur l’autre sur les côtés, comme une patineuse, les bras suivent.'},
  pas_chasses: {name:'Pas chassés', type:'time', start:30, z:'cardio', cue:'Pas chassés rapides sur le côté : 3 pas à droite, 3 pas à gauche.'},
  boxe:        {name:'Boxe dans le vide', type:'time', start:30, z:'cardio', cue:'Garde haute : on enchaîne directs et crochets en tournant le buste, pieds légers.'},
  fente_saut:  {name:'Fentes sautées', type:'time', start:30, z:'cardio', hard:true, cue:'En fente, on saute pour changer de jambe en l’air ; réception souple.'},

  climber:     {name:'Mountain climbers', type:'time', start:30, z:['cardio','abdos'], floor:true, hard:true, cue:'En planche sur les mains, on ramène les genoux vers la poitrine, vite.'},
  plank_jacks: {name:'Plank jacks', type:'time', start:30, z:'cardio', floor:true, cue:'En planche sur les mains : on écarte et on resserre les pieds en sautant.'}
};

/* Échauffements : ~2 min 15 d'effort, adaptés aux parties du corps de la séance */
const WARMUPS = {
  bas:    [['rotations',30],['genoux',45],['w_squat',30],['w_fente',30]],
  haut:   [['w_bras',30],['w_epaules',30],['w_jacks',45],['w_pompes_mur',30]],
  abdos:  [['w_buste',30],['genoux',45],['w_chat',30],['w_birddog',30]],
  cardio: [['genoux',30],['w_talons',30],['w_jacks',45],['w_squat',30]],
  full:   [['rotations',30],['w_bras',30],['w_jacks',45],['w_squat',30]]
};

/* Séances : format 'circuit' (tours), 'pyramid' (paliers : objectif × factors, pauses rests)
   ou 'tabata' (blocs de 8 × 20 s / 10 s, 2 exercices en alternance).
   slots : zones (l'app choisit les exercices) ou id d'exercice imposé. */
const RECIPES = {
  jambes:        {name:'Jambes & fessiers', kind:'muscu', warm:'bas', format:'circuit', rounds:3, slots:['bas','bas','bas','bas','bas']},
  haut_abdos:    {name:'Haut du corps & abdos', kind:'muscu', warm:'haut', format:'circuit', rounds:3, slots:['haut','haut','haut','abdos','abdos']},
  fessiers_pyr:  {name:'Fessiers en pyramide', kind:'muscu', warm:'bas', format:'pyramid', factors:[.6,.8,1,.8,.6], rests:[10,10,15,10,10], slots:['bas','bas','bas','bas','bas']},
  abdos:         {name:'Abdos & gainage', kind:'muscu', warm:'abdos', format:'circuit', rounds:3, slots:['abdos','abdos','abdos','abdos','abdos','abdos']},
  full:          {name:'Corps entier', kind:'muscu', warm:'full', format:'circuit', rounds:3, slots:['bas','haut','bas','haut','abdos']},
  bras:          {name:'Bras & épaules', kind:'muscu', warm:'haut', format:'pyramid', factors:[.6,.8,1,.8,.6], rests:[10,10,15,10,10], slots:['haut','haut','haut','haut','haut']},
  hiit:          {name:'HIIT corps entier', kind:'cardio', warm:'cardio', format:'circuit', rounds:4, slots:['cardio','cardio','bas','cardio','cardio','bas']},
  tabata:        {name:'Tabata', kind:'cardio', warm:'cardio', format:'tabata', blocks:[['cardio','cardio'],['cardio','bas'],['cardio','abdos'],['cardio','cardio']]},
  cardio_abdos:  {name:'Cardio & abdos', kind:'cardio', warm:'abdos', format:'circuit', rounds:3, slots:['cardio','abdos','cardio','abdos','cardio','abdos']},
  pyr_cardio:    {name:'Pyramide cardio', kind:'cardio', warm:'cardio', format:'pyramid', factors:[2/3,1,4/3,1,2/3], rests:[5,10,15,10,5], timeOnly:true, slots:['cardio','cardio','cardio','cardio','cardio']},
  cardio_jambes: {name:'Cardio jambes', kind:'cardio', warm:'bas', format:'circuit', rounds:3, slots:['cardio','bas','cardio','bas','cardio']},
  boxe:          {name:'Boxe & cardio', kind:'cardio', warm:'full', format:'tabata', blocks:[['boxe','cardio'],['boxe','abdos'],['boxe','cardio'],['boxe','abdos']]}
};
/* Programme : cycle de 4 semaines, muscu et cardio en alternance */
const CYCLE = [
  ['jambes','hiit','haut_abdos'],
  ['tabata','fessiers_pyr','cardio_abdos'],
  ['abdos','pyr_cardio','full'],
  ['cardio_jambes','bras','boxe']
];
const EXTRA_THEMES = [
  {id:'bas', label:'Bas du corps', r:['jambes','fessiers_pyr','cardio_jambes']},
  {id:'haut', label:'Haut du corps', r:['bras','haut_abdos','full']},
  {id:'abdos', label:'Abdos', r:['abdos','cardio_abdos']},
  {id:'cardio', label:'Cardio', r:['hiit','tabata','pyr_cardio','boxe','cardio_jambes']},
  {id:'surprise', label:'Surprise', r:Object.keys(RECIPES)}
];
const KINDS = {muscu:'🏋️ Muscu', cardio:'⚡ Cardio'};
/* Pauses (s) : base, puis un peu plus si effort long ou intense, changement d'haltère,
   chevillères à mettre, passage debout <-> sol. Plafond 'max', pause de fin de tour au moins 'round'. */
const REST = {
  muscu:  {between:15, round:30, max:25},
  cardio: {between:10, round:20, max:20},
  warm:5, afterWarm:15, tabata:10, block:45
};
/* Forme du jour : effort et pauses */
const FEEL = {
  tired:  {label:'Fatiguée', effort:0.85, rest:5, hint:'Séance allégée (−15 %, un bloc de moins en tabata), pauses un peu plus longues.'},
  normal: {label:'Normale', effort:1, rest:0, hint:'La séance prévue.'},
  great:  {label:'En forme', effort:1.1, rest:0, hint:'Séance renforcée (+10 %, 25 s d’effort en tabata).'}
};
/* Niveaux : points cumulés */
const LEVELS = [[0,'Débutante'],[50,'Motivée'],[150,'Régulière'],[300,'Déterminée'],[500,'Sportive'],[800,'Endurante'],
  [1200,'Tonique'],[1700,'Athlète'],[2300,'Guerrière'],[3000,'Inarrêtable'],[3800,'Championne'],[4800,'Légende'],[6000,'Mythique']];
const LEVEL_STEP = 1500;   // après Mythique : un niveau tous les 1 500 points
const GOAL_BONUS = 20, FULL_BONUS = 10;
const TARGET_SEC = 20*60;   // durée visée d'une séance

/* =========================================================
   Logique d'ajustement (fonctions pures, testées)
   ========================================================= */
function roundTarget(type, v){ return type === 'time' ? Math.round(v/5)*5 : Math.round(v); }

/* Retour sur un exercice -> nouvel objectif pour la prochaine fois
   Trop dur : -15 % | Trop facile : +15 % | 2 × OK de suite : +5 % | pas de retour : rien */
function adjust(def, cur, rating){
  const st = {target:cur.target, weight:(cur.weight ?? null), okStreak:(cur.okStreak || 0)};
  const res = {target:st.target, weight:st.weight, okStreak:st.okStreak, change:null};
  if (!rating || def.warm) return res;
  const L = LIMITS[def.type];
  let dir = 0, factor = 0;
  if (rating === 'hard'){ dir = -1; factor = 0.15; res.okStreak = 0; }
  else if (rating === 'easy'){ dir = 1; factor = 0.15; res.okStreak = 0; }
  else if (rating === 'ok'){
    res.okStreak = st.okStreak + 1;
    if (res.okStreak >= 2){ dir = 1; factor = 0.05; res.okStreak = 0; }
  }
  if (!dir) return res;
  let t = roundTarget(def.type, st.target * (1 + dir*factor));
  if (dir > 0 && t < st.target + L.step) t = st.target + L.step;   // toujours au moins +1 pas
  if (dir < 0 && t > st.target - L.step) t = st.target - L.step;   // toujours au moins -1 pas
  if (dir > 0 && t > L.max){
    if (st.target >= L.max && st.weight && st.weight < MAX_WEIGHT){   // au max -> haltère du dessus
      res.weight = st.weight + 1; res.target = roundTarget(def.type, L.max*2/3); res.change = 'weight-up';
      return res;
    }
    t = L.max;
  }
  if (dir < 0 && t < L.min){
    if (st.target <= L.min && st.weight && st.weight > MIN_WEIGHT){   // au min -> haltère plus léger
      res.weight = st.weight - 1; res.change = 'weight-down';
      res.target = Math.min(L.max, roundTarget(def.type, st.target * st.weight / res.weight));   // même effort qu'avant
      return res;
    }
    t = L.min;
  }
  res.target = t;
  if (t !== st.target) res.change = t > st.target ? 'up' : 'down';
  return res;
}

/* Objectif du jour : pyramide et forme du jour (l'objectif de base ne change pas) */
function scaled(type, v, f){
  if (f === 1) return v;
  return type === 'time' ? Math.max(10, Math.round(v*f/5)*5) : Math.max(3, Math.round(v*f));
}
function zonesOf(d){ return [].concat(d.z || []); }
function effortSec(s){ return s.type === 'time' ? s.dur : s.target * (EXERCISES[s.exId].pace || 3) * (s.sides ? 2 : 1); }

function stepFor(id, st, extra, f){
  const d = EXERCISES[id];
  const s = d.warm ? {target:d.start, weight:null} : st.ex[id];
  const step = Object.assign({kind:'work', exId:id, type:d.type, target:d.warm ? s.target : scaled(d.type, s.target, f || 1),
    weight:s.weight ?? null, sides:!!d.sides, warm:!!d.warm}, extra);
  if (step.type === 'time') step.dur = step.target * (step.sides ? 2 : 1);
  return step;
}

/* Pause entre deux exercices */
function restFor(r, w, s, n, ctx, fe){
  const R = REST[r.kind], ds = EXERCISES[s.exId], dn = EXERCISES[n.exId];
  const weightChange = n.weight && n.weight !== ctx.held ? n.weight : null;
  const anklesOn = dn.gear === 'chevillères' && !ctx.ankles;
  let dur;
  if (w.brk === 'warm' && n.warm) dur = REST.warm;
  else if (w.brk === 'tabata') dur = REST.tabata;
  else if (w.brk === 'block') dur = REST.block;
  else {
    const base = w.brk === 'warm' ? REST.afterWarm : r.format === 'pyramid' ? r.rests[w.lvl] : R.between;
    let more = 0;
    if (!s.warm && effortSec(s) > 45) more += 5;
    if (ds.hard) more += 5;
    if (weightChange) more += 5;
    if (anklesOn) more += 10;
    if (!!ds.floor !== !!dn.floor) more += 5;
    dur = Math.min(base + more, Math.max(base, R.max));
    if (w.brk === 'round') dur = Math.max(dur, r.format === 'pyramid' ? r.rests[w.lvl] + 10 : R.round);
  }
  if (fe.rest && dur >= 15) dur += fe.rest;   // fatiguée : +5 s sur les vraies pauses
  return {kind:'rest', dur, prevExId:s.exId, roundBreak:w.brk === 'round' || w.brk === 'block',
    warm:w.brk === 'warm' && !!n.warm, quick:w.brk === 'tabata', weightChange, anklesOn};
}

/* Séance -> suite d'étapes : matériel, prêt, échauffement, exercices et pauses */
function buildPlan(sess, st, feel){
  const r = RECIPES[sess.rid], fe = FEEL[feel] || FEEL.normal;
  const work = [];
  if (!sess.noWarm) WARMUPS[r.warm].forEach(([id, sec]) => work.push({step:stepFor(id, st, {round:0, target:sec}), brk:'warm'}));
  if (r.format === 'tabata'){
    const nb = sess.items.length/2 - (fe.effort < 1 ? 1 : 0), sec = fe.effort > 1 ? 25 : 20;
    for (let b = 0; b < nb; b++)
      for (let k = 0; k < 8; k++)
        work.push({step:stepFor(sess.items[2*b + k%2], st, {round:b+1, pos:k+1, of:nb, type:'time', target:sec, sides:false, fixed:true}), brk:k === 7 ? 'block' : 'tabata'});
  } else {
    const factors = r.format === 'pyramid' ? r.factors : Array(sess.rounds || r.rounds).fill(1);
    const peak = factors.indexOf(Math.max(...factors));
    factors.forEach((fa, i) => sess.items.forEach((id, j) =>
      work.push({step:stepFor(id, st, {round:i+1, pos:j+1, early:i < peak}, fa * fe.effort), brk:j === sess.items.length - 1 ? 'round' : 'between', lvl:i})));
  }
  const steps = [{kind:'gear'}, {kind:'ready', dur:5}];
  const ctx = {held:null, ankles:false};
  work.forEach((w, i) => {
    const s = w.step, n = work[i+1] && work[i+1].step;
    if (s.weight) ctx.held = s.weight;
    if (EXERCISES[s.exId].gear === 'chevillères') ctx.ankles = true;
    steps.push(s);
    if (n) steps.push(restFor(r, w, s, n, ctx, fe));
  });
  steps.forEach((s, i) => { if (s.kind !== 'work') s.next = steps.slice(i+1).find(x => x.kind === 'work') || null; });
  return steps;
}

function estimateSec(sess, st, feel){
  return buildPlan(sess, st, feel).reduce((a, s) => a + (s.kind === 'work' ? effortSec(s) : s.kind === 'gear' ? 0 : s.dur), 0);
}

/* =========================================================
   Programme de la semaine & choix des exercices
   ========================================================= */
function weekStartOf(t){ const x = new Date(t); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x.getTime(); }
function weekStart(){ return weekStartOf(now()); }
function prevWeek(ws){ return weekStartOf(ws - 3*DAY); }
function cycleWeek(ws){ const n = Math.round((ws - CYCLE_ORIGIN)/WEEK) % CYCLE.length; return (n + CYCLE.length) % CYCLE.length; }
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0; }

/* Choisit les exercices d'une séance : d'abord ceux faits il y a le plus longtemps.
   En cardio : pas d'exercice au sol pour les jambes, pas de chevillères. Puis règle tours / paliers pour ~20 min. */
function makeSession(rid, st, seed, used){
  const r = RECIPES[rid], cardio = r.kind === 'cardio';
  const slots = r.format === 'tabata' ? r.blocks.flat() : r.slots;
  const taken = new Set(slots.filter(z => EXERCISES[z]));
  const lastUse = id => Math.max((st.ex[id] && st.ex[id].last) || 0, (used && used.get(id)) || 0);
  const items = slots.map(z => {
    if (EXERCISES[z]) return z;
    const c = Object.keys(EXERCISES).filter(id => {
      const d = EXERCISES[id];
      return !d.warm && !taken.has(id) && zonesOf(d).includes(z) && (!r.timeOnly || d.type === 'time') && (r.format !== 'tabata' || !d.sides)
        && !(cardio && (d.gear || (z === 'bas' && d.floor)));
    });
    c.sort((a, b) => lastUse(a) - lastUse(b) || hashStr(a + seed) - hashStr(b + seed));
    taken.add(c[0]);
    return c[0];
  });
  // muscu : debout puis au sol, du plus léger au plus lourd -> moins de temps perdu entre les exercices
  const order = list => cardio ? list : list.slice().sort((a, b) => !!EXERCISES[a].floor - !!EXERCISES[b].floor || (st.ex[a].weight || 0) - (st.ex[b].weight || 0));
  const options = [];
  if (r.format === 'circuit')
    for (let k = items.length; k >= Math.max(3, items.length - 2); k--) for (let n = 2; n <= 6; n++) options.push({rid, items:order(items.slice(0, k)), rounds:n});
  else if (r.format === 'pyramid')
    for (let k = items.length; k >= 2; k--) options.push({rid, items:order(items.slice(0, k))});
  else options.push({rid, items});
  const gap = s => Math.abs(estimateSec(s, st) - TARGET_SEC) + (r.format === 'circuit' ? (items.length - s.items.length) * 60 : 0);
  const best = options.reduce((a, b) => gap(b) < gap(a) ? b : a);
  if (used) best.items.forEach(id => used.set(id, 1e15 + used.size));
  return best;
}
function ensurePlan(){
  const ws = weekStart();
  if (state.plan && Math.abs(state.plan.week - ws) < 2*DAY) return state.plan;   // même semaine (même en voyage)
  const cw = cycleWeek(ws), used = new Map();
  state.plan = {week:ws, cycle:cw, sessions:CYCLE[cw].map(rid => makeSession(rid, state, 'w' + ws + rid, used))};
  save();
  return state.plan;
}
function kindOf(h){ return h.kind || (RECIPES[h.sessionId] && RECIPES[h.sessionId].kind) || null; }
function doneSlots(plan){
  const done = new Set(state.history.filter(h => h.week === plan.week && Number.isInteger(h.slot)).map(h => h.slot));
  state.history.forEach(h => {   // séances de la semaine enregistrées sans case (avant la v2) : reconnues par leur type
    if (h.week != null || h.extra || h.mini || weekStartOf(Date.parse(h.date)) !== weekStart()) return;
    const i = plan.sessions.findIndex((s, k) => s.rid === h.sessionId && !done.has(k));
    if (i >= 0) done.add(i);
  });
  return done;
}
function recommendedSlot(plan, done){
  const last = state.history.find(h => !h.mini), lastKind = last ? kindOf(last) : null;
  const todo = plan.sessions.map((s, i) => i).filter(i => !done.has(i));
  const alt = todo.find(i => RECIPES[plan.sessions[i].rid].kind !== lastKind);
  return alt ?? (todo.length ? todo[0] : -1);
}
function chooseExtraRecipe(themeId){
  const theme = EXTRA_THEMES.find(t => t.id === themeId) || EXTRA_THEMES[4];
  const inPlan = new Set((state.plan ? state.plan.sessions : []).map(s => s.rid));
  const lastDone = rid => { const h = state.history.find(x => x.sessionId === rid); return h ? new Date(h.date).getTime() : 0; };
  const seed = String(now());
  return theme.r.slice().sort((a, b) => inPlan.has(a) - inPlan.has(b) || lastDone(a) - lastDone(b) || hashStr(a + seed) - hashStr(b + seed))[0];
}

/* =========================================================
   Points, niveaux, indice de forme, série de semaines
   ========================================================= */
function sessionPoints(h){ return Math.max(1, Math.round((h.durationSec || 0)/60)) + (h.total > 0 && h.done >= h.total ? FULL_BONUS : 0); }
function weekCounts(){
  const m = new Map();
  state.history.forEach(h => { if (h.mini) return; const w = weekStartOf(new Date(h.date).getTime()); m.set(w, (m.get(w) || 0) + 1); });
  return m;
}
function totalPoints(){
  let p = state.history.reduce((a, h) => a + sessionPoints(h), 0);
  weekCounts().forEach(c => { if (c >= WEEK_GOAL) p += GOAL_BONUS; });
  return p;
}
function levelOf(p){
  let i = 0;
  while (i + 1 < LEVELS.length && p >= LEVELS[i+1][0]) i++;
  let lvl = i + 1, from = LEVELS[i][0], to = LEVELS[i+1] ? LEVELS[i+1][0] : null;
  if (to === null){ const k = Math.floor((p - from)/LEVEL_STEP); lvl += k; from += k*LEVEL_STEP; to = from + LEVEL_STEP; }
  return {lvl, name:LEVELS[i][1], from, to, p};
}
/* Indice de forme : 100 au départ, + 1 point par 10 % de progrès sur un exercice (objectif × haltère) */
function vol(d, s){ return s.target * (d.weight ? (s.weight || d.weight) : 1); }
function formeIndex(st){
  let sum = 0;
  for (const [id, s] of Object.entries(st.ex)){
    const d = EXERCISES[id];
    sum += vol(d, s) / vol(d, {target:d.start, weight:d.weight}) - 1;
  }
  return Math.max(50, Math.round(100 + sum * 10));
}
function formeSeries(){
  const byWeek = new Map();
  state.history.slice().reverse().forEach(h => { if (Number.isFinite(h.forme)) byWeek.set(weekStartOf(new Date(h.date).getTime()), h.forme); });
  return [...byWeek.entries()].slice(-8);
}
function streak(){
  const m = weekCounts();
  let w = weekStart(), n = 0;
  if ((m.get(w) || 0) < WEEK_GOAL) w = prevWeek(w);
  while ((m.get(w) || 0) >= WEEK_GOAL){ n++; w = prevWeek(w); }
  return n;
}

/* =========================================================
   Stockage
   ========================================================= */
let storageOK = true, readOnly = false;   // readOnly : on ne peut pas (ou ne doit pas) écrire
function defaultState(){
  const ex = {};
  for (const [id, d] of Object.entries(EXERCISES)) if (!d.warm) ex[id] = {target:d.start, weight:d.weight ?? null, okStreak:0, last:0};
  return {version:1, ex, history:[], settings:{sound:true, voice:true}, plan:null};
}
function normalize(raw){
  const base = defaultState();
  if (!raw || typeof raw !== 'object') return base;
  const out = {version:1, ex:base.ex, history:[], settings:Object.assign({}, base.settings, raw.settings || {}), plan:null};
  if (raw.ex && typeof raw.ex === 'object'){
    for (const id of Object.keys(base.ex)){
      const r = raw.ex[id];
      if (r && Number.isFinite(r.target)) out.ex[id] = {
        target:r.target,
        weight:Number.isFinite(r.weight) ? r.weight : base.ex[id].weight,
        okStreak:(r.okStreak | 0),
        last:Number.isFinite(r.last) ? r.last : 0
      };
    }
  }
  if (Array.isArray(raw.history)) out.history = raw.history.filter(h => h && typeof h === 'object' && h.date && Number.isFinite(Date.parse(h.date)));
  const p = raw.plan;
  if (p && Number.isFinite(p.week) && Array.isArray(p.sessions) && p.sessions.length &&
      p.sessions.every(s => s && RECIPES[s.rid] && Array.isArray(s.items) && s.items.length && s.items.every(id => EXERCISES[id] && !EXERCISES[id].warm)))
    out.plan = {week:p.week, cycle:p.cycle | 0, sessions:p.sessions.map(s => Object.assign({rid:s.rid, items:s.items.slice()},
      Number.isInteger(s.rounds) && s.rounds > 0 && s.rounds < 9 ? {rounds:s.rounds} : {}))};
  return out;
}
function load(){
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); }
  catch(e){ storageOK = false; readOnly = true; return defaultState(); }          // stockage bloqué (navigation privée)
  try { const k = '__cm_test__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); }
  catch(e){ storageOK = false; readOnly = true; }                                  // lecture possible mais écriture impossible (mémoire pleine)
  if (!raw) return defaultState();
  try { return normalize(JSON.parse(raw)); }
  catch(e){                                                                        // données illisibles : on les met de côté avant toute écriture
    try { localStorage.setItem(STORE_KEY + '.illisible', raw); } catch(err){ storageOK = false; readOnly = true; }
    return defaultState();
  }
}
function save(){
  if (readOnly) return false;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); storageOK = true; return true; }
  catch(e){ storageOK = false; return false; }
}
let state = load();

/* =========================================================
   Son, voix, vibration, écran allumé
   ========================================================= */
const events = [];   // journal (utilisé par les tests)
function logEv(type, value){ events.push({type, value, t:Date.now()}); if (events.length > 300) events.shift(); }
let actx = null;
function unlockAudio(){
  try {
    if (!actx){ const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch(e){}
}
function beep(freq, ms){
  logEv('beep', freq);
  if (!state.settings.sound || !actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + ms/1000);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + ms/1000 + 0.03);
  } catch(e){}
}
function buzz(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }
function say(text){
  logEv('say', text);
  if (!state.settings.voice) return;
  try {
    const s = window.speechSynthesis; if (!s) return;
    s.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR'; u.rate = 1.05;
    const vs = s.getVoices().filter(v => /^fr[-_]FR$/i.test(v.lang));
    const v = vs.find(v => v.localService && v.default) || vs.find(v => v.localService) || vs[0]; if (v) u.voice = v;
    s.speak(u);
  } catch(e){}
}
let wakeLock = null;
async function keepAwake(on){
  try {
    if (on){
      if ('wakeLock' in navigator && !wakeLock){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } else if (wakeLock){ const w = wakeLock; wakeLock = null; await w.release(); }
  } catch(e){ wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && run && !run.finished){ keepAwake(true); unlockAudio(); }
});

/* =========================================================
   Moteur de séance
   ========================================================= */
let view = 'home', tab = 'home', previewSess = null, run = null, timerId = null, pendingImport = null;
const cur = () => run.plan[run.idx];

function startSession(sess){
  unlockAudio();
  run = {session:sess, recipe:RECIPES[sess.rid], feel:'normal', plan:buildPlan(sess, state, 'normal'), idx:-1, startedAt:now(),
         pausedTotal:0, pausedAt:0, paused:false, ratings:{}, done:new Set(), endAt:null, remaining:0, lastBeep:null, switched:false};
  keepAwake(true);
  view = 'workout';
  goStep(0);
  clearInterval(timerId);
  timerId = setInterval(tick, 200);
}
function goStep(i){
  run.idx = i;
  const s = cur();
  run.lastBeep = null; run.switched = false;
  if (s.kind === 'ready' && !run.begun){ run.begun = true; run.startedAt = now(); run.pausedTotal = 0; }   // la durée compte à partir d'ici
  run.endAt = (s.kind === 'gear' || (s.kind === 'work' && s.type === 'reps')) ? null : now() + s.dur*1000;
  run.stepStart = now();
  announce(s);
  render();
}
function unitWord(s, short){
  const d = EXERCISES[s.exId];
  const u = s.type === 'time' ? (short ? 's' : 'secondes') : (short ? 'rép.' : 'répétitions');
  const side = s.sides ? (d.sideWord === 'jambe' ? (short ? '/jambe' : ' par jambe') : (short ? '/côté' : ' par côté')) : '';
  return u + side;
}
function spoken(s){ return s.fixed ? EXERCISES[s.exId].name : `${EXERCISES[s.exId].name}, ${s.target} ${unitWord(s)}`; }
function listFr(a){ return a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' et ' + a[a.length-1]; }
function gearOf(plan){
  const w = new Set(); let ankles = false, mat = false;
  plan.forEach(s => {
    if (s.kind !== 'work') return;
    if (s.weight) w.add(s.weight);
    const d = EXERCISES[s.exId];
    if (d.gear === 'chevillères') ankles = true;
    if (d.floor) mat = true;
  });
  return {weights:[...w].sort((a, b) => a - b), ankles, mat};
}
function gearItems(g){
  const out = [];
  if (g.weights.length) out.push(['🏋️', 'Haltères ' + listFr(g.weights.map(x => x + ' kg'))]);
  if (g.ankles) out.push(['🦵', 'Chevillères']);
  if (g.mat) out.push(['🧘', 'Tapis de sol']);
  return out;
}
function gearSpeech(g){
  const parts = [];
  if (g.weights.length) parts.push('tes haltères de ' + listFr(g.weights.map(String)) + ' kilos');
  if (g.ankles) parts.push('les chevillères');
  if (g.mat) parts.push('ton tapis');
  return parts.length ? 'Pour cette séance, prépare : ' + listFr(parts) + '.' : 'Pas de matériel aujourd’hui.';
}
function restNote(s){
  const n = [];
  if (s.weightChange) n.push(`avec ${s.weightChange} kilos`);
  if (s.anklesOn) n.push('mets les chevillères');
  return n.length ? ', ' + n.join(', ') : '';
}
function announce(s){
  if (s.kind === 'gear') say(gearSpeech(gearOf(run.plan)));
  else if (s.kind === 'ready') say('Prépare-toi : ' + EXERCISES[s.next.exId].name);
  else if (s.kind === 'work'){ beep(1046, 200); buzz(150); say(spoken(s)); }
  else if (s.warm) return;
  else if (s.quick){ if (s.weightChange || s.anklesOn) say('Ensuite : ' + EXERCISES[s.next.exId].name + restNote(s)); }
  else if (s.dur < 10) say('Ensuite : ' + EXERCISES[s.next.exId].name + restNote(s));
  else say(s.next ? 'Repos. Ensuite : ' + EXERCISES[s.next.exId].name + restNote(s) : 'Repos');
}
function tick(){
  if (!run || run.paused || run.finished || view !== 'workout') return;
  const s = cur();
  if (run.endAt === null){ updateTimer(); return; }
  const msLeft = run.endAt - now();
  if (s.kind === 'work' && s.sides && s.type === 'time' && !run.switched && msLeft <= s.target*1000){
    run.switched = true; beep(660, 260); buzz([100, 80, 100]); say('Change de côté');
    render(); return;
  }
  const secLeft = Math.ceil(msLeft/1000);
  if (secLeft <= 3 && secLeft >= 1 && run.lastBeep !== secLeft){ run.lastBeep = secLeft; beep(s.kind === 'work' ? 660 : 880, 110); }
  if (msLeft <= 0){ advance(true); return; }
  updateTimer();
}
function advance(completed){
  if (run.paused) resumeRun();
  const s = cur();
  if (s.kind === 'work' && completed) run.done.add(run.idx);
  if (run.idx + 1 < run.plan.length) goStep(run.idx + 1); else finish();
}
function pauseRun(){
  if (run.paused) return;
  run.paused = true; run.pausedAt = now();
  if (run.endAt !== null) run.remaining = run.endAt - now();
}
function resumeRun(){
  if (!run.paused) return;
  run.pausedTotal += now() - run.pausedAt;
  run.stepStart += now() - run.pausedAt;
  if (run.endAt !== null) run.endAt = now() + run.remaining;
  run.paused = false;
}
function finish(){
  if (run.paused) resumeRun();
  run.finished = true; run.endedAt = now();
  clearInterval(timerId); timerId = null;
  keepAwake(false);
  beep(1318, 350); buzz([200, 100, 200]); say(doneCount() ? 'Séance terminée. Bravo !' : 'Séance arrêtée.');
  view = 'end';
  render();
}
function abandon(){
  clearInterval(timerId); timerId = null;
  keepAwake(false);
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){}
  run = null; view = 'home'; tab = 'home';
  render();
}
function elapsedSec(){ return run.begun ? Math.max(0, Math.round(((run.endedAt || now()) - run.startedAt - run.pausedTotal)/1000)) : 0; }
function doneCount(){ return [...run.done].filter(i => !run.plan[i].warm).length; }
function ratedIds(){
  const ids = [];
  [...run.done].sort((a,b)=>a-b).forEach(i => { const s = run.plan[i]; if (!s.warm && !s.fixed && !ids.includes(s.exId)) ids.push(s.exId); });
  return ids;
}
function weekCount(){ return weekCounts().get(weekStart()) || 0; }
function saveSession(){
  const ptsBefore = totalPoints(), wkBefore = weekCount();
  const changes = [];
  for (const id of ratedIds()){
    const r = run.ratings[id]; if (!r) continue;
    const before = state.ex[id];
    const after = adjust(EXERCISES[id], before, (run.feel === 'tired' && r === 'easy') || (run.feel === 'great' && r === 'hard') ? 'ok' : r);
    state.ex[id] = {target:after.target, weight:after.weight, okStreak:after.okStreak, last:before.last};
    if (after.change) changes.push({id, from:before.target, to:after.target, wFrom:before.weight, wTo:after.weight, change:after.change});
  }
  run.done.forEach(i => { const s = run.plan[i]; if (!s.warm && state.ex[s.exId]) state.ex[s.exId].last = run.startedAt; });
  const sess = run.session, r = run.recipe, inPlan = Number.isInteger(sess.slot) && Math.abs(sess.week - weekStartOf(run.startedAt)) < 2*DAY;   // commencée dans la semaine du programme
  const total = run.plan.filter(s => s.kind === 'work' && !s.warm).length;
  state.history.unshift({
    id:String(run.startedAt), date:new Date(run.startedAt).toISOString(), sessionId:sess.rid,
    name:r.name, kind:r.kind, mini:false, extra:!!sess.extra || !inPlan,
    week:inPlan ? sess.week : null, slot:inPlan ? sess.slot : null,
    feel:run.feel, durationSec:elapsedSec(), done:doneCount(), total,
    ratings:Object.assign({}, run.ratings), changes, forme:formeIndex(state)
  });
  if (state.history.length > 1500) state.history.length = 1500;
  const ok = save();
  const lvBefore = levelOf(ptsBefore), lvAfter = levelOf(totalPoints());
  run.saved = true; run.changes = changes;
  run.gain = {points:lvAfter.p - ptsBefore, levelUp:lvAfter.lvl > lvBefore.lvl, goal:wkBefore < WEEK_GOAL && weekCount() >= WEEK_GOAL};
  if (run.gain.levelUp){ beep(1568, 400); say(`Bravo ! Tu passes au niveau ${lvAfter.lvl} : ${lvAfter.name}.`); }
  toast(ok ? 'Séance enregistrée' : 'Impossible d’enregistrer sur ce téléphone');
  render();
}

/* =========================================================
   Sauvegarde / restauration / réinitialisation
   ========================================================= */
async function exportData(){
  const payload = JSON.stringify({app:'coach-maison', version:1, exportedAt:new Date().toISOString(), data:state}, null, 2);
  const name = 'crocofit-sauvegarde-' + new Date().toISOString().slice(0,10) + '.json';
  try {
    const file = new File([payload], name, {type:'application/json'});
    if (navigator.canShare && navigator.share && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Sauvegarde CrocoFit'});
      toast('Sauvegarde prête'); return;
    }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([payload], {type:'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Sauvegarde téléchargée');
}
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj || obj.app !== 'coach-maison' || !obj.data || !obj.data.ex) throw new Error('format');
      pendingImport = normalize(obj.data);
      modal('Restaurer cette sauvegarde ?',
        `${pendingImport.history.length} séance(s) dans le fichier. Les données actuelles de ce téléphone seront remplacées.`,
        [{label:'Restaurer', action:'import-confirm', cls:'primary'}, {label:'Annuler', action:'modal-close'}]);
    } catch(err){ toast('Fichier non reconnu'); }
    e.target.value = '';
  };
  reader.readAsText(f);
});

/* =========================================================
   Affichage
   ========================================================= */
const $app = document.getElementById('app');
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso, opts){ try { return new Date(iso).toLocaleDateString('fr-FR', opts || {weekday:'short', day:'numeric', month:'short'}); } catch(e){ return ''; } }
function cap(t){ return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
function fmtMin(sec){ return Math.max(1, Math.round(sec/60)) + ' min'; }
function fmtMinSec(sec){ return Math.floor(sec/60) + ' min' + (sec % 60 ? ' ' + String(sec % 60).padStart(2, '0') : ''); }
function fmtClock(sec){ sec = Math.max(0, sec); return sec >= 60 ? Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0') : String(sec); }
function targetLabel(s){ return `${s.target} ${unitWord(s, true)}`; }
function kindTag(kind){ return `<span class="tag">${KINDS[kind]}</span>`; }
function chipsFor(s){
  const d = EXERCISES[s.exId], c = [];
  if (s.weight) c.push(`<span class="chip" data-test="chip-weight">${s.weight} kg</span>`);
  if (d.gear) c.push(`<span class="chip">${esc(d.gear)}</span>`);
  if (s.sides) c.push(`<span class="chip">${d.sideWord === 'jambe' ? 'chaque jambe' : 'chaque côté'}</span>`);
  return c.length ? `<div class="chips">${c.join('')}</div>` : '';
}
function formatText(sess){
  const r = RECIPES[sess.rid];
  if (r.format === 'tabata') return `Tabata : ${sess.items.length/2} blocs de 4 min (20 s à fond, 10 s de repos)`;
  if (r.format === 'pyramid') return `Pyramide : ${r.factors.length} paliers, l’effort monte puis redescend`;
  const n = sess.rounds || r.rounds;
  return `${n} tour${n > 1 ? 's' : ''} de ${sess.items.length} exercices`;
}
function exNames(sess){ return [...new Set(sess.items)].map(id => EXERCISES[id].name); }
function tabbar(){
  const t = (id, label) => `<button class="tab ${tab === id ? 'on' : ''}" data-action="tab" data-id="${id}" data-test="tab-${id}">${label}</button>`;
  return `<nav class="tabbar"><div class="inner">${t('home','Séances')}${t('progress','Progrès')}${t('settings','Réglages')}</div></nav>`;
}
function storageWarn(){ return storageOK ? '' : `<div class="warn" data-test="storage-warn">Ce téléphone refuse l’enregistrement (navigation privée ou mémoire pleine ?). Les séances ne seront pas sauvegardées.</div>`; }
function levelBar(lv){ return `<div class="lvlbar"><i style="width:${Math.round(100*(lv.p - lv.from)/(lv.to - lv.from))}%"></i></div>`; }

function renderHome(){
  const plan = ensurePlan(), done = doneSlots(plan), reco = recommendedSlot(plan, done);
  const wk = weekCount(), lv = levelOf(totalPoints()), stk = streak();
  const cards = plan.sessions.map((s, i) => {

      <div class="s-name">${esc(r.name)}</div>
      <div class="s-focus">${esc(names.slice(0, 3).join(', '))}${names.length > 3 ? '…' : ''}</div>
      <div class="s-meta">≈ ${fmtMin(estimateSec(s, state))} · ${esc(formatText(s))}</div></div>
      <span class="go" aria-hidden="true">›</span></button>`;
  }).join('');
  return `
  <header class="top"><div><div class="eyebrow">${esc(cap(fmtDate(new Date(now()).toISOString(), {weekday:'long', day:'numeric', month:'long'})))}</div><h1>CrocoFit</h1></div></header>
  ${storageWarn()}
  <section class="card week">
    <div class="mot"><div class="lv"><div class="small muted">Niveau ${lv.lvl}</div><b data-test="level">${esc(lv.name)}</b>${levelBar(lv)}</div>
      <div class="side-stat"><b data-test="forme">${formeIndex(state)}</b><span class="small muted">forme</span></div>
      <div class="side-stat"><b data-test="streak">${stk ? '🔥 ' + stk : '–'}</b><span class="small muted">série</span></div></div>
  </section>
  <section class="card week">
    <div class="row between"><span>Cette semaine</span><strong data-test="week">${wk} / ${WEEK_GOAL} séances</strong></div>
    <div class="dots">${Array.from({length:Math.max(WEEK_GOAL, wk)}, (_, i) => `<span class="dot ${i < wk ? 'on' : ''}"></span>`).join('')}</div>
    ${wk >= WEEK_GOAL ? '<div class="small" style="margin-top:10px;color:var(--rest);font-weight:700">Objectif atteint 🎉 Tout le reste, c’est du bonus !</div>' : ''}
  </section>
  <h2>Ton programme de la semaine</h2>
  <div class="list">${cards}</div>
  <div style="margin-top:12px"><button class="btn ghost" data-action="extra" data-test="extra">+ Séance en plus</button></div>`;

function previewRows(sess){
  const r = RECIPES[sess.rid];
  if (r.format === 'tabata'){
    const rows = [];
    for (let b = 0; b < sess.items.length/2; b++){
      const a = sess.items[2*b], c = sess.items[2*b+1];
      rows.push(`<div class="pv-item"><span class="t">Bloc ${b+1} : ${esc(EXERCISES[a].name)} / ${esc(EXERCISES[c].name)}</span><span class="v">8 × 20 s</span></div>`);
    }
    return rows.join('');
  }
  return sess.items.map(id => {
    const st = stepFor(id, state, {});
    const v = r.format === 'pyramid'
      ? r.factors.map(f => scaled(st.type, st.target, f)).join(' · ') + ' ' + unitWord(st, true)
      : targetLabel(st);
    return `<div class="pv-item"><span class="t">${esc(EXERCISES[id].name)}</span><span class="v">${v}${st.weight ? ' · ' + st.weight + ' kg' : ''}</span></div>`;
  }).join('');
}
function renderPreview(){
  const s = previewSess, r = RECIPES[s.rid];
  const plan = buildPlan(s, state), gear = gearItems(gearOf(plan));
  const warm = s.noWarm ? [] : WARMUPS[r.warm];
  const restInfo = r.format === 'tabata' ? '' : ` · pauses courtes (${r.format === 'pyramid' ? r.rests[0] + ' à ' + Math.max(...r.rests) : REST[r.kind].between} s), un peu plus quand il faut changer de matériel`;
  return `
  <button class="back" data-action="home">‹ Retour</button>
  <div class="s-top">${kindTag(r.kind)}${s.extra ? '<span class="tag">Séance en plus</span>' : ''}</div>
  <h1>${esc(r.name)}</h1>
  <p class="muted">≈ ${fmtMin(estimateSec(s, state))} · ${esc(formatText(s))}${restInfo}</p>
  <section class="card"><div class="small muted" data-test="pv-gear">Matériel : ${gear.length ? esc(gear.map(g => g[1]).join(', ')) : 'aucun'}</div></section>
  ${warm.length ? `<div class="pv-sec">Échauffement · ${fmtMinSec(warm.reduce((a, w) => a + w[1], 0))}</div>
  <section class="card" style="padding-top:4px;padding-bottom:4px">${warm.map(([id, sec]) => `<div class="pv-item"><span class="t">${esc(EXERCISES[id].name)}</span><span class="v">${sec} s</span></div>`).join('')}</section>` : ''}
  <div class="pv-sec">Au programme${r.format === 'circuit' && (s.rounds || r.rounds) > 1 ? ' (à chaque tour)' : ''}</div>
  <section class="card" style="padding-top:4px;padding-bottom:4px">${previewRows(s)}</section>
  <p class="small muted">Monte le son. Après chaque exercice, dis comment c’était : la séance s’ajuste la fois suivante.</p>
  <div class="stick"><button class="btn primary" data-action="start" data-test="start">C’est parti</button></div>`;
}

function ringSvg(color){
  return `<svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="90" fill="none" stroke-width="12"/>
  <circle class="val" id="ringVal" cx="100" cy="100" r="90" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="565.49" stroke-dashoffset="0"/></svg>`;
}
function ratingRow(exId){
  const r = run.ratings[exId];
  return `<div class="rate">${[['hard','Trop dur'],['ok','OK'],['easy','Trop facile']].map(([v, l]) =>
    `<button class="rbtn r-${v} ${r === v ? 'sel' : ''}" data-action="rate" data-ex="${exId}" data-v="${v}" aria-pressed="${r === v}" data-test="rate-${exId}-${v}">${l}</button>`).join('')}</div>`;

function nextCard(n, label, rest){
  if (!n) return '';

  if (rest && rest.anklesOn) tips.push('Mets les chevillères');

    ${tips.length ? `<div class="tip" data-test="tip">${tips.join(' · ')}</div>` : ''}</div>`;

function stepLabel(s){
  const r = run.recipe, n = run.session.items.length;

  if (r.format === 'tabata') return `Bloc ${s.round}/${s.of} · ${s.pos}/8`;
